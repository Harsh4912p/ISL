name: isl_translate
description: Real-Time Indian Sign Language Translation for Video Calls Using AI
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  google_fonts: ^6.0.0
  intl: ^0.19.0
  animate_do: ^3.1.2
  fl_chart: ^0.68.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  vibration: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  camera: ^0.11.0+2
  camera_web: ^0.3.5
  camera_windows: ^0.2.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  provider: ^6.0.0
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/illustrations/
